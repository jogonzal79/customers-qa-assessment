services:
  mysql:
    image: mysql:8.4
    container_name: customers-qa-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: customers_qa
      MYSQL_USER: qa
      MYSQL_PASSWORD: qa
      TZ: UTC
    command: ["--default-time-zone=+00:00"]
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uqa", "-pqa", "--silent"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s
